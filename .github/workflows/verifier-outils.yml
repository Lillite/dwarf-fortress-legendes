name: Vérifier les outils Legends

on:
  push:
    branches: [main-story-writer]
    paths: ['outils/**', 'tests/**', '.github/workflows/**']
  pull_request:
    branches: [main-story-writer]
    paths: ['outils/**', 'tests/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tester l'import et les rapports
        run: python3 -m unittest discover -s tests -v
