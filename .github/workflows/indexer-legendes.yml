name: Indexer un export Legends

on:
  push:
    branches: ['legendes/**']
    paths:
      - 'sources/**/*.[xX][mM][lL]'
      - 'outils/analyser_legendes.py'
      - 'outils/legends_*.py'
      - 'outils/ci_legendes.py'
      - '.github/workflows/indexer-legendes.yml'
  workflow_dispatch:
    inputs:
      branche:
        description: "Branche d’export (legendes/…), à analyser avec les outils de main"
        type: string
        required: true

concurrency:
  group: indexer-legendes-${{ inputs.branche || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  indexer:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    env:
      BRANCHE: ${{ inputs.branche || github.ref_name }}
    steps:
      - name: Vérifier la branche de lancement manuel
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Lancer depuis main et renseigner la branche du monde dans le champ branche.' >&2
            exit 1
          fi

      - name: Récupérer les outils de main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'refs/heads/main' }}

      - name: Extraire les XML du commit sélectionné
        id: source
        env:
          COMMIT_POUSSE: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python3 outils/ci_legendes.py preparer

      - name: Indexer et préparer les rapports
        if: steps.source.outputs.xml == 'true'
        run: |
          python3 outils/analyser_legendes.py \
            --sources "$RUNNER_TEMP/legends-ci/sources" \
            --rapports "$RUNNER_TEMP/legends-ci/publication/reperes/index-legends" \
            --base "$RUNNER_TEMP/legends-ci/legendes.sqlite"

      - name: Publier les rapports sur la branche du monde
        env:
          COMMIT_SOURCE: ${{ steps.source.outputs.commit }}
        run: python3 outils/ci_legendes.py publier

      - name: Proposer la base SQLite au téléchargement
        if: steps.source.outputs.xml == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: legendes-sqlite-${{ steps.source.outputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legends-ci/legendes.sqlite
          if-no-files-found: error
