name: Importer l’original Legends vérifié
on:
  push:
    branches: [legendes/region1-an-100-02-28]
    paths: ['.github/workflows/import-region1-100.yml']
permissions:
  contents: write
jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier le fichier original et le déposer comme objet Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth=1 --single-branch --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" import
          cd import
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_file=sources/region1-00100-02-28-legends.xml
          gzip -dc "$source_file.gz" > "$source_file"
          echo "b6c4315398494c30bce5ce6d491bc24e7fa64a8a6ee9a17af7ff55ee02fdfbfc  $source_file" | sha256sum -c -
          git -c core.autocrlf=false add -f -- "$source_file"
          test "$(git rev-parse ":$source_file")" = 90718a486aeadf84e93cfd249068c17de2f15fbc
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Archiver l’original XML vérifié de région 1'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
