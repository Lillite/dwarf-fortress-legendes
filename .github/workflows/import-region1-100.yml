name: Importer l’original Legends vérifié
on:
  push:
    branches: [legendes/region1-an-100-02-28]
    paths: ['sources/region1-00100-02-28-legends.xml.gz']
permissions:
  contents: write
jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier le fichier original et le déposer comme objet Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/sources/region1-00100-02-28-legends.xml.gz" --output original.gz
          gzip -dc original.gz > original.xml
          echo 'b6c4315398494c30bce5ce6d491bc24e7fa64a8a6ee9a17af7ff55ee02fdfbfc  original.xml' | sha256sum -c -
          test "$(git hash-object original.xml)" = 90718a486aeadf84e93cfd249068c17de2f15fbc
          python3 -c 'import base64,json,pathlib; pathlib.Path("blob.json").write_text(json.dumps({"encoding":"base64","content":base64.b64encode(pathlib.Path("original.xml").read_bytes()).decode("ascii")}), encoding="ascii")'
          blob_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input blob.json --jq '.sha')"
          test "$blob_sha" = 90718a486aeadf84e93cfd249068c17de2f15fbc
